<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tủ Sách Cá Nhân</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --warning-color: #e74c3c;
            --sidebar-width: 260px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
        }
        
        /* THANH MENU DỌC BÊN TRÁI */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #ffffff;
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            padding: 25px 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar h2 {
            font-size: 1.3rem;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }
        .search-box {
            width: 100%;
            padding: 10px 15px;
            font-size: 0.9rem;
            border: 2px solid #ddd;
            border-radius: 20px;
            margin-bottom: 25px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .search-box:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(44, 62, 80, 0.15);
        }
        
        /* CẤU TRÚC KHỐI BỘ LỌC */
        .filter-group {
            margin-bottom: 25px;
        }
        .filter-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #7f8c8d;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .filter-select {
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            border: 2px solid #edf2f7;
            background-color: #f8fafc;
            border-radius: 8px;
            outline: none;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-select:focus {
            border-color: var(--primary-color);
        }

        /* KHU VỰC HIỂN THỊ CHÍNH BÊN PHẢI */
        .main-content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 40px;
            box-sizing: border-box;
            min-height: 100vh;
        }
        .duplicate-alert {
            display: none;
            background-color: #fdf2f2;
            color: var(--warning-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 5px solid var(--warning-color);
            font-weight: 500;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .book-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        .duplicate-tag {
            position: absolute;
            top: 10px; right: 10px;
            background-color: var(--warning-color);
            color: white; padding: 4px 8px;
            font-size: 0.75rem; font-weight: bold; border-radius: 4px;
        }
        .book-img-container {
            width: 100%; height: 260px;
            background-color: #eee;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .book-card img { width: 100%; height: 100%; object-fit: cover; }
        .book-info { padding: 12px; text-align: center; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .book-title { font-size: 0.95rem; font-weight: bold; margin: 0; color: #2c3e50; line-height: 1.4; }
        .loading { text-align: center; font-size: 1.2rem; color: #666; margin-top: 100px; }

        /* Điện thoại di động co giãn ẩn hiện menu mượt mà */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; padding: 20px; }
            .main-content { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- THANH MENU DỌC BÊN TRÁI -->
    <aside class="sidebar">
        <h2>📚 MY LIB </h2>
        
        <!-- Ô tìm kiếm tên sách -->
        <input type="text" id="searchBox" class="search-box" placeholder="Tìm tên sách..." oninput="handleAllFilters()">

        <!-- 1. BỘ LỌC THỂ LOẠI (Ở TRÊN) -->
        <div class="filter-group">
            <div class="filter-title">Thể loại</div>
            <select id="categoryFilter" class="filter-select" onchange="handleAllFilters()">
                <option value="all">Tất cả thể loại</option>
            </select>
        </div>

        <!-- 2. BỘ LỌC TÁC GIẢ (Ở GIỮA) -->
        <div class="filter-group">
            <div class="filter-title">Tác giả</div>
            <select id="authorFilter" class="filter-select" onchange="handleAllFilters()">
                <option value="all">Tất cả tác giả</option>
            </select>
        </div>

        <!-- 3. BỘ LỌC LOẠI FILE (DƯỚI CÙNG) -->
        <div class="filter-group">
            <div class="filter-title">Loại file</div>
            <select id="fileFilter" class="filter-select" onchange="handleAllFilters()">
                <option value="all">Tất cả loại file</option>
            </select>
        </div>
    </aside>

    <!-- KHU VỰC HIỂN THỊ SÁCH BÊN PHẢI -->
    <main class="main-content">
        <div class="duplicate-alert" id="duplicateAlert"></div>
        <div id="loadingText" class="loading">⏳ Đang tải dữ liệu từ Google Sheet...</div>
        <div class="book-grid" id="bookGrid"></div>
    </main>

    <script>
        // ID Google Sheet của bạn
        const SHEET_ID = '1XnRvJ2RKDeVYuBijmWLPyAseIQQtFbKErof-pl1sZdY';
        const SPREADSHEET_URL = `https://google.com{SHEET_ID}/pub?output=csv`;

        let myBooks = [];

        // Hàm đọc dữ liệu CSV từ 5 cột
        function parseCSV(text) {
            let lines = text.split('\n');
            let result = [];
            for (let i = 0; i < lines.length; i++) {
                // Xử lý dấu phẩy để tách cột chính xác
                let currentline = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (currentline.length >= 5) {
                    result.push({
                        title: currentline[0].replace(/['"]+/g, '').trim(),
                        category: currentline[1].replace(/['"]+/g, '').trim(),
                        author: currentline[2].replace(/['"]+/g, '').trim(),
                        fileType: currentline[3].replace(/['"]+/g, '').trim(),
                        imgUrl: currentline[4].replace(/['"]+/g, '').trim()
                    });
                }
            }
            return result;
        }

        async function fetchBooksFromSheet() {
            try {
                const response = await fetch(SPREADSHEET_URL);
                const text = await response.text();
                const parsedData = parseCSV(text);
                
                // Loại bỏ dòng tiêu đề đầu tiên trong Sheet
                myBooks = parsedData.filter(book => 
                    book.title !== '' && 
                    book.title.toLowerCase() !== 'tên sách'
                );

                document.getElementById('loadingText').style.display = 'none';
                
                // Tự động tạo danh sách lựa chọn cho các Bộ lọc dựa theo dữ liệu bạn nhập
                populateFilterOptions();
                checkDuplicateBooks();
                handleAllFilters();
            } catch (error) {
                document.getElementById('loadingText').innerHTML = '❌ Lỗi kết nối. Hãy đảm bảo bạn đã vào Google Sheet chọn Tệp -> Chia sẻ -> Xuất bản lên web!';
                console.error(error);
            }
        }

        // Tự động gom các Thể loại, Tác giả, Loại file từ 1000 cuốn sách vào ô chọn (Không bị lặp)
        function populateFilterOptions() {
            const categories = [...new Set(myBooks.map(b => b.category).filter(Boolean))];
            const authors = [...new Set(myBooks.map(b => b.author).filter(Boolean))];
            const fileTypes = [...new Set(myBooks.map(b => b.fileType).filter(Boolean))];

            const catSelect = document.getElementById('categoryFilter');
            categories.forEach(c => catSelect.options[catSelect.options.length] = new Option(c, c));

            const authorSelect = document.getElementById('authorFilter');
            authors.forEach(a => authorSelect.options[authorSelect.options.length] = new Option(a, a));

            const fileSelect = document.getElementById('fileFilter');
            fileTypes.forEach(f => fileSelect.options[fileSelect.options.length] = new Option(f, f));
        }

        function checkDuplicateBooks() {
            const titles = myBooks.map(b => b.title.toLowerCase());
            const duplicates = myBooks.filter((book, index) => titles.indexOf(book.title.toLowerCase()) !== index);
            const alertBox = document.getElementById('duplicateAlert');
